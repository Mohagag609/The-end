services:
  - type: web
    name: musharaka-pro
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 4 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: musharaka-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.6

databases:
  - name: musharaka-db
    databaseName: the_end
    user: the_end_user
    plan: free