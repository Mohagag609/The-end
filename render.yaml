databases:
  - name: musharaka-db
    databaseName: musharaka_db
    user: musharaka_user
    plan: free

services:
  - type: web
    name: musharaka-pro
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn musharaka_pro.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: musharaka-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"