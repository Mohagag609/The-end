{% extends "base.html" %}

{% block title %}مشروع جديد - Musharaka Pro{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">إنشاء مشروع جديد</h1>
        
        <form action="/project/new" method="POST">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">كود المشروع</label>
                <input type="text" name="code" required 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="مثال: P001">
                <p class="mt-1 text-sm text-gray-500">كود فريد لتعريف المشروع</p>
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">اسم المشروع</label>
                <input type="text" name="name" required 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="مثال: مشروع البناء الأول">
            </div>
            
            <div class="flex justify-end space-x-reverse space-x-3">
                <a href="/" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">
                    إلغاء
                </a>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                    إنشاء المشروع
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
