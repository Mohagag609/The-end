{% extends 'base.html' %}
{% load humanize %}

{% block title %}{{ project.name }} - التفاصيل{% endblock %}

{% block content %}
<div class="py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">
            <i class="fas fa-project-diagram ml-2"></i>
            {{ project.name }}
        </h1>
        
        <div class="bg-white shadow rounded-lg p-6">
            <p class="text-gray-600">كود المشروع: {{ project.code }}</p>
            <p class="text-gray-600">الحالة: {{ project.get_status_display }}</p>
            
            <div class="mt-6">
                <a href="/project/{{ project.id }}/" 
                   class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700">
                    <i class="fas fa-dashboard ml-2"></i>
                    لوحة التحكم
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
